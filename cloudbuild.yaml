steps:
  # 1. Install workspace dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Run full monorepo build & deterministic unit test suite
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'test']

  # 3. Run Agent Online Evaluation Suite & Behavioral Rubric Scenarios
  # Uses Google Cloud Application Default Credentials / Vertex AI in Cloud Build
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'eval', '--workspace', '@uk-sa-app/orchestrator']
    env:
      - 'GCP_PROJECT=uk-self-assessment'
      - 'GCP_REGION=europe-west2'

  # 4. Build Docker container image for Orchestrator BFF
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west2-docker.pkg.dev/uk-self-assessment/cloud-run-source-deploy/uk-sa-orchestrator:$SHORT_SHA'
      - '-t'
      - 'europe-west2-docker.pkg.dev/uk-self-assessment/cloud-run-source-deploy/uk-sa-orchestrator:latest'
      - '-f'
      - 'apps/orchestrator/Dockerfile'
      - '.'

  # 5. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west2-docker.pkg.dev/uk-self-assessment/cloud-run-source-deploy/uk-sa-orchestrator:$SHORT_SHA']

  # 6. Deploy Orchestrator container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'uk-sa-orchestrator'
      - '--image=europe-west2-docker.pkg.dev/uk-self-assessment/cloud-run-source-deploy/uk-sa-orchestrator:$SHORT_SHA'
      - '--region=europe-west2'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # 7. Online Post-Deployment Smoke Test (Online Verification)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe uk-sa-orchestrator --region=europe-west2 --format='value(status.url)')
        echo "Testing deployed endpoint online at $$SERVICE_URL/api/health"
        curl -sS --fail "$$SERVICE_URL/api/health" || exit 1
        echo "✓ Deployed Cloud Run orchestrator is healthy and online."

images:
  - 'europe-west2-docker.pkg.dev/uk-self-assessment/cloud-run-source-deploy/uk-sa-orchestrator:$SHORT_SHA'
  - 'europe-west2-docker.pkg.dev/uk-self-assessment/cloud-run-source-deploy/uk-sa-orchestrator:latest'
